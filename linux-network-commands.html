<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Linux Network Commands Reference — interactive guide to diagnostics, config, monitoring, transfer, security, DNS, firewall and wireless commands.">
<title>NetRef — Linux Network Commands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ── Reset & Variables ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #080c14;
  --bg2:      #0c1220;
  --bg3:      #101828;
  --card:     #111a2c;
  --card-hi:  #162035;
  --border:   rgba(255,255,255,0.06);
  --border2:  rgba(255,255,255,0.12);
  --text:     #b8cce4;
  --text2:    #6b8aaa;
  --text3:    #3d5472;
  --white:    #e8f0fa;
  --green:    #00e88f;
  --cyan:     #22d3ee;
  --amber:    #f59e0b;
  --purple:   #a78bfa;
  --red:      #f87171;
  --orange:   #fb923c;
  --pink:     #f472b6;
  --blue:     #60a5fa;
  --sidebar-w: 220px;
  --list-w:    360px;
}

html { scroll-behavior: smooth; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── Animated grid background ─────────────────────────────────── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(34,211,238,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(34,211,238,0.025) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse 60% 40% at 70% 20%, rgba(34,211,238,0.04) 0%, transparent 60%),
              radial-gradient(ellipse 40% 60% at 20% 80%, rgba(0,232,143,0.03) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* ── Top bar ───────────────────────────────────────────────────── */
.topbar {
  height: 52px;
  display: flex;
  align-items: center;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  background: rgba(8,12,20,0.9);
  backdrop-filter: blur(12px);
  position: relative;
  z-index: 10;
  flex-shrink: 0;
  gap: 16px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}

.logo-mark {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  color: var(--bg);
  background: var(--green);
  padding: 4px 7px;
  border-radius: 5px;
  letter-spacing: 0.5px;
}

.logo-name {
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--white);
  letter-spacing: -0.3px;
}

.logo-sep {
  color: var(--text3);
  margin: 0 2px;
}

.logo-sub {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--text3);
  letter-spacing: 1px;
}

.topbar-search {
  flex: 1;
  max-width: 420px;
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0 12px;
  transition: border-color 0.2s;
}

.topbar-search:focus-within {
  border-color: rgba(34,211,238,0.4);
  box-shadow: 0 0 0 3px rgba(34,211,238,0.06);
}

.search-prompt {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--green);
  flex-shrink: 0;
}

.search-input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--white);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  padding: 9px 0;
  caret-color: var(--green);
}

.search-input::placeholder { color: var(--text3); }

.search-kbd {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  color: var(--text3);
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 4px;
  padding: 1px 5px;
  flex-shrink: 0;
}

.topbar-count {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  color: var(--green);
  background: rgba(0,232,143,0.08);
  border: 1px solid rgba(0,232,143,0.2);
  padding: 3px 10px;
  border-radius: 20px;
  white-space: nowrap;
}

/* ── Main layout ───────────────────────────────────────────────── */
.app {
  display: flex;
  flex: 1;
  overflow: hidden;
  position: relative;
  z-index: 1;
}

/* ── Sidebar ───────────────────────────────────────────────────── */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: rgba(11,17,32,0.8);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  scrollbar-width: none;
}
.sidebar::-webkit-scrollbar { display: none; }

.sidebar-section {
  padding: 20px 12px 8px;
}

.sidebar-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  color: var(--text3);
  padding: 0 8px;
  margin-bottom: 6px;
}

.cat-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 10px;
  border-radius: 7px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  color: var(--text2);
  font-size: 13px;
  font-weight: 500;
  position: relative;
}

.cat-item:hover { background: var(--card); color: var(--text); }

.cat-item.active {
  background: var(--card);
  color: var(--white);
}

.cat-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  transform: translateY(-50%);
  width: 3px; height: 18px;
  background: var(--item-color, var(--cyan));
  border-radius: 0 2px 2px 0;
}

.cat-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--item-color, var(--cyan));
  flex-shrink: 0;
  transition: opacity 0.15s;
}

.cat-item:not(.active) .cat-dot { opacity: 0.4; }

.cat-count {
  margin-left: auto;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--text3);
}

.sidebar-divider {
  height: 1px;
  background: var(--border);
  margin: 8px 12px;
}

.sidebar-footer {
  margin-top: auto;
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--text3);
  line-height: 1.7;
}

/* ── Command list ──────────────────────────────────────────────── */
.cmd-list-panel {
  width: var(--list-w);
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.list-header {
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}

.list-header-title {
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--white);
  letter-spacing: -0.2px;
}

.list-header-count {
  margin-left: auto;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--text3);
}

.cmd-list {
  overflow-y: auto;
  flex: 1;
  padding: 8px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.cmd-list::-webkit-scrollbar { width: 4px; }
.cmd-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.group-header {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text3);
  padding: 10px 8px 5px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.group-header::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.cmd-item {
  padding: 11px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.12s;
  border: 1px solid transparent;
  margin-bottom: 3px;
  position: relative;
  overflow: hidden;
}

.cmd-item::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--item-accent, var(--cyan));
  opacity: 0;
  transition: opacity 0.12s;
  border-radius: 2px 0 0 2px;
}

.cmd-item:hover { background: var(--card); }
.cmd-item:hover::before { opacity: 0.6; }

.cmd-item.active {
  background: var(--card-hi);
  border-color: var(--border2);
}
.cmd-item.active::before { opacity: 1; }

.cmd-item-name {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  color: var(--item-accent, var(--cyan));
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 4px;
}

.cmd-item-badge {
  font-size: 8px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text3);
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  padding: 1px 6px;
  border-radius: 8px;
}

.cmd-item-desc {
  font-size: 11px;
  color: var(--text2);
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── Detail panel ──────────────────────────────────────────────── */
.detail-panel {
  flex: 1;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.detail-panel::-webkit-scrollbar { width: 4px; }
.detail-panel::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.detail-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 14px;
  color: var(--text3);
  user-select: none;
}

.placeholder-glyph {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 48px;
  color: var(--border2);
  line-height: 1;
}

.placeholder-text {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--text3);
  text-align: center;
  line-height: 1.8;
}

.detail-content {
  animation: fadeSlide 0.2s ease-out;
}

@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Detail header */
.detail-header {
  padding: 28px 32px 22px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: rgba(8,12,20,0.95);
  backdrop-filter: blur(16px);
  z-index: 5;
}

.detail-header-top {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 10px;
}

.detail-icon {
  width: 48px; height: 48px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  color: var(--icon-color);
  background: var(--icon-bg);
  border: 1px solid var(--icon-border);
  flex-shrink: 0;
  letter-spacing: 0.5px;
}

.detail-cmd {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 32px;
  font-weight: 600;
  line-height: 1;
  color: var(--cmd-color);
}

.detail-cat-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--cat-color);
  background: var(--cat-bg);
  border: 1px solid var(--cat-border);
  padding: 3px 10px;
  border-radius: 20px;
  margin-top: 6px;
}

.detail-desc-short {
  font-size: 14px;
  line-height: 1.6;
  color: var(--text2);
  margin-top: 10px;
}

/* Detail body */
.detail-body {
  padding: 24px 32px 48px;
}

.section {
  margin-bottom: 28px;
}

.section-title {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.syntax-block {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 14px 16px;
  overflow: hidden;
}

.syntax-text {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  color: var(--amber);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.copy-btn {
  flex-shrink: 0;
  background: rgba(0,232,143,0.08);
  border: 1px solid rgba(0,232,143,0.25);
  color: var(--green);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  padding: 6px 12px;
  border-radius: 7px;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  white-space: nowrap;
}

.copy-btn:hover { background: rgba(0,232,143,0.16); }
.copy-btn:active { transform: scale(0.97); }

/* Flags table */
.flags-table {
  width: 100%;
  border-collapse: collapse;
}

.flags-table tr {
  border-bottom: 1px solid var(--border);
  transition: background 0.1s;
}

.flags-table tr:last-child { border-bottom: none; }
.flags-table tr:hover { background: var(--card); }

.flag-key {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  color: var(--orange);
  padding: 9px 16px 9px 0;
  vertical-align: top;
  white-space: nowrap;
  width: 1%;
}

.flag-val {
  font-size: 13px;
  color: var(--text);
  padding: 9px 0;
  line-height: 1.5;
}

/* Examples */
.example {
  margin-bottom: 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}

.example-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.03);
  border-bottom: 1px solid var(--border);
  padding: 6px 14px;
}

.example-dots {
  display: flex;
  gap: 4px;
}

.example-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
}

.example-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.8px;
  color: var(--text3);
}

.example-code {
  padding: 14px 16px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  line-height: 1.9;
  white-space: pre;
  overflow-x: auto;
  background: #060a12;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.example-code::-webkit-scrollbar { height: 4px; }
.example-code::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.ex-prompt { color: var(--green); }
.ex-cmd    { color: var(--cyan); }
.ex-flag   { color: var(--orange); }
.ex-arg    { color: var(--purple); }
.ex-out    { color: var(--text3); }

/* Related tags */
.related-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.rel-tag {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  padding: 5px 12px;
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: 7px;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.15s;
  text-decoration: none;
}

.rel-tag:hover {
  border-color: var(--cyan);
  color: var(--cyan);
  background: rgba(34,211,238,0.06);
}

/* ── Mobile overlay ────────────────────────────────────────────── */
@media (max-width: 900px) {
  .sidebar { display: none; }
  :root { --list-w: 280px; }
}

@media (max-width: 640px) {
  .cmd-list-panel {
    position: fixed;
    left: 0; top: 52px; bottom: 0;
    width: 100%;
    z-index: 20;
    background: var(--bg);
    transform: translateX(-100%);
    transition: transform 0.25s ease;
  }
  .cmd-list-panel.open { transform: translateX(0); }
  .detail-header { padding: 20px 20px 16px; }
  .detail-body { padding: 20px 20px 48px; }
  .detail-cmd { font-size: 24px; }
  .mobile-back {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--cyan);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    margin-bottom: 12px;
  }
  .topbar-search { max-width: none; }
  .logo-sub { display: none; }
}

/* ── No-results ────────────────────────────────────────────────── */
.no-results {
  padding: 40px 16px;
  text-align: center;
  color: var(--text3);
}

.no-results-glyph {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 32px;
  color: var(--border2);
  display: block;
  margin-bottom: 10px;
}

/* ── Stagger entry animation ───────────────────────────────────── */
.cmd-item {
  animation: itemIn 0.3s ease-out both;
}

@keyframes itemIn {
  from { opacity: 0; transform: translateX(-6px); }
  to   { opacity: 1; transform: translateX(0); }
}
</style>
</head>
<body>

<!-- Top bar -->
<header class="topbar">
  <a class="logo" href="#">
    <span class="logo-mark">NET</span>
    <span class="logo-name">NetRef<span class="logo-sep"> / </span></span>
    <span class="logo-sub">LINUX · NETWORK</span>
  </a>

  <div class="topbar-search">
    <span class="search-prompt">$&gt;</span>
    <input class="search-input" id="search" type="search"
           placeholder="Search commands, flags, descriptions…"
           autocomplete="off" autocorrect="off" spellcheck="false" />
    <span class="search-kbd">Ctrl K</span>
  </div>

  <div class="topbar-count" id="count">35 cmds</div>
</header>

<!-- App -->
<div class="app">

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Categories</div>
      <div id="cat-nav"></div>
    </div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-footer">
      NetRef v1.0<br>
      35 network commands<br>
      8 categories<br>
      Keyboard: ↑↓ navigate<br>
      Ctrl+K: focus search<br>
      Esc: clear search
    </div>
  </nav>

  <!-- Command list -->
  <div class="cmd-list-panel" id="listPanel">
    <div class="list-header">
      <div class="list-header-title" id="listTitle">All Commands</div>
      <div class="list-header-count" id="listCount"></div>
    </div>
    <div class="cmd-list" id="cmdList"></div>
  </div>

  <!-- Detail -->
  <main class="detail-panel" id="detailPanel">
    <div class="detail-placeholder" id="placeholder">
      <div class="placeholder-glyph">$_</div>
      <div class="placeholder-text">
        Select a command to view details<br>
        <span style="color:var(--text3);font-size:10px">or press Ctrl+K to search</span>
      </div>
    </div>
    <div class="detail-content" id="detailContent" style="display:none"></div>
  </main>

</div>

<script>
/* ── Data ─────────────────────────────────────────────────────── */
const CATS = [
  { id:'all',      label:'All Commands', color:'#22d3ee', count:35 },
  { id:'diag',     label:'Diagnostics',  color:'#00e88f' },
  { id:'config',   label:'Config',       color:'#a78bfa' },
  { id:'monitor',  label:'Monitor',      color:'#f59e0b' },
  { id:'transfer', label:'Transfer',     color:'#fb923c' },
  { id:'security', label:'Security',     color:'#f87171' },
  { id:'dns',      label:'DNS',          color:'#f472b6' },
  { id:'firewall', label:'Firewall',     color:'#60a5fa' },
  { id:'wireless', label:'Wireless',     color:'#00e88f' },
];

const CMDS = [
  // ── Diagnostics ───────────────────────────────────────────────
  { name:'ping', cat:'diag',
    desc:'Send ICMP echo requests to test host reachability and measure round-trip latency.',
    syntax:'ping [options] destination',
    flags:[
      {f:'-c N',     d:'Stop after N packets sent'},
      {f:'-i N',     d:'Interval in seconds between packets (default 1)'},
      {f:'-t N',     d:'Set the IP Time-To-Live value'},
      {f:'-s N',     d:'Packet payload size in bytes (default 56)'},
      {f:'-W N',     d:'Timeout in seconds waiting for each reply'},
      {f:'-q',       d:'Quiet — only print summary at end'},
      {f:'-4 / -6',  d:'Force IPv4 or IPv6'},
      {f:'-f',       d:'Flood ping — send as fast as possible (root)'},

/* ── State ────────────────────────────────────────────────────── */
let activeCat   = 'all';
let activeCmd   = null;
let searchQuery = '';

/* ── Helpers ──────────────────────────────────────────────────── */
function catColor(id) {
  return (CATS.find(c => c.id === id) || {}).color || '#22d3ee';
}

function getFiltered() {
  const q = searchQuery.toLowerCase();
  return CMDS.filter(c => {
    if (activeCat !== 'all' && c.cat !== activeCat) return false;
    if (!q) return true;
    return (
      c.name.includes(q) ||
      c.desc.toLowerCase().includes(q) ||
      c.syntax.toLowerCase().includes(q) ||
      c.flags.some(f => f.f.includes(q) || f.d.toLowerCase().includes(q)) ||
      (c.related || []).some(r => r.includes(q))
    );
  });
}

function catCount(id) {
  if (id === 'all') return CMDS.length;
  return CMDS.filter(c => c.cat === id).length;
}

/* ── Render sidebar ───────────────────────────────────────────── */
function renderSidebar() {
  const nav = document.getElementById('cat-nav');
  nav.innerHTML = CATS.map(c => `
    <div class="cat-item ${activeCat === c.id ? 'active' : ''}"
         style="--item-color:${c.color}"
         onclick="selectCat('${c.id}')">
      <span class="cat-dot"></span>
      <span>${c.label}</span>
      <span class="cat-count">${catCount(c.id)}</span>
    </div>`).join('');
}

/* ── Render command list ──────────────────────────────────────── */
function renderList() {
  const filtered = getFiltered();
  const listEl   = document.getElementById('cmdList');
  const titleEl  = document.getElementById('listTitle');
  const countEl  = document.getElementById('listCount');
  const topCount = document.getElementById('count');

  const catObj = CATS.find(c => c.id === activeCat) || CATS[0];
  titleEl.textContent = searchQuery ? `Results` : catObj.label;
  countEl.textContent = filtered.length + ' commands';
  topCount.textContent = filtered.length + ' cmd' + (filtered.length !== 1 ? 's' : '');

  if (!filtered.length) {
    listEl.innerHTML = `<div class="no-results">
      <span class="no-results-glyph">∅</span>
      No results for "<strong>${searchQuery}</strong>"
    </div>`;
    return;
  }

  let html = '';
  if (activeCat === 'all' && !searchQuery) {
    const groups = {};
    filtered.forEach(c => { (groups[c.cat] = groups[c.cat] || []).push(c); });
    Object.keys(groups).forEach(cat => {
      const co = CATS.find(c => c.id === cat);
      html += `<div class="group-header">${co ? co.label : cat}</div>`;
      html += groups[cat].map((c, i) => renderItem(c, i)).join('');
    });
  } else {
    html = filtered.map((c, i) => renderItem(c, i)).join('');
  }
  listEl.innerHTML = html;
}

function renderItem(cmd, idx) {
  const color = catColor(cmd.cat);
  const isActive = activeCmd === cmd.name;
  const catLabel = (CATS.find(c => c.id === cmd.cat) || {}).label || cmd.cat;
  const delay = Math.min(idx * 0.03, 0.3);
  return `<div class="cmd-item ${isActive ? 'active' : ''}"
              style="--item-accent:${color}; animation-delay:${delay}s"
              onclick="selectCmd('${cmd.name}')">
    <div class="cmd-item-name">
      ${cmd.name}
      <span class="cmd-item-badge">${catLabel}</span>
    </div>
    <div class="cmd-item-desc">${cmd.desc.split('—')[0].split('.')[0].trim()}</div>
  </div>`;
}

/* ── Render detail ────────────────────────────────────────────── */
function renderDetail(name) {
  const cmd = CMDS.find(c => c.name === name);
  if (!cmd) return;

  const color   = catColor(cmd.cat);
  const catObj  = CATS.find(c => c.id === cmd.cat) || {};
  const iconBg  = color + '18';
  const iconBd  = color + '40';

  // Flags HTML
  let flagsHtml = '';
  if (cmd.flags && cmd.flags.length) {
    flagsHtml = `
    <div class="section">
      <div class="section-title">Options &amp; flags</div>
      <table class="flags-table">
        ${cmd.flags.map(f => `
        <tr>
          <td class="flag-key">${f.f}</td>
          <td class="flag-val">${f.d}</td>
        </tr>`).join('')}
      </table>
    </div>`;
  }

  // Examples HTML
  let exHtml = '';
  if (cmd.examples && cmd.examples.length) {
    exHtml = `
    <div class="section">
      <div class="section-title">Examples</div>
      ${cmd.examples.map(ex => `
      <div class="example">
        <div class="example-bar">
          <div class="example-dots">
            <div class="example-dot" style="background:#f87171"></div>
            <div class="example-dot" style="background:#f59e0b"></div>
            <div class="example-dot" style="background:#00e88f"></div>
          </div>
          <span class="example-label">bash — ${ex.t}</span>
        </div>
        <div class="example-code">${ex.c}</div>
      </div>`).join('')}
    </div>`;
  }

  // Related HTML
  let relHtml = '';
  if (cmd.related && cmd.related.length) {
    relHtml = `
    <div class="section">
      <div class="section-title">Related commands</div>
      <div class="related-tags">
        ${cmd.related.map(r => `
        <a class="rel-tag" href="#" onclick="searchRelated(event,'${r}')">${r}</a>`).join('')}
      </div>
    </div>`;
  }

  document.getElementById('detailContent').innerHTML = `
    <div class="detail-header">
      <div class="detail-header-top">
        <div class="detail-icon"
             style="--icon-color:${color};--icon-bg:${iconBg};--icon-border:${iconBd}">
          ${cmd.name.toUpperCase().slice(0,4)}
        </div>
        <div>
          <div class="detail-cmd" style="--cmd-color:${color}">${cmd.name}</div>
          <div class="detail-cat-badge"
               style="--cat-color:${color};--cat-bg:${iconBg};--cat-border:${iconBd}">
            ● ${(catObj.label || cmd.cat).toUpperCase()}
          </div>
        </div>
      </div>
      <div class="detail-desc-short">${cmd.desc}</div>
    </div>
    <div class="detail-body">
      <div class="section">
        <div class="section-title">Syntax</div>
        <div class="syntax-block">
          <span class="syntax-text">${cmd.syntax}</span>
          <button class="copy-btn" onclick="copySyntax('${cmd.name}')">⎘ Copy syntax</button>
        </div>
      </div>
      ${flagsHtml}${exHtml}${relHtml}
    </div>`;

  document.getElementById('placeholder').style.display = 'none';
  const dc = document.getElementById('detailContent');
  dc.style.display = 'block';
  dc.style.animation = 'none';
  void dc.offsetWidth;
  dc.style.animation = '';
  document.getElementById('detailPanel').scrollTop = 0;
}

/* ── Interactions ─────────────────────────────────────────────── */
function selectCat(id) {
  activeCat = id;
  searchQuery = '';
  document.getElementById('search').value = '';
  renderSidebar();
  renderList();
}

function selectCmd(name) {
  activeCmd = name;
  renderList();
  renderDetail(name);
}

function searchRelated(e, name) {
  e.preventDefault();
  const found = CMDS.find(c => c.name === name);
  if (found) {
    selectCmd(name);
  } else {
    document.getElementById('search').value = name;
    searchQuery = name;
    activeCat = 'all';
    renderSidebar();
    renderList();
  }
}

function copySyntax(name) {
  const cmd = CMDS.find(c => c.name === name);
  if (!cmd) return;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(cmd.syntax).catch(() => {});
  }
  const btn = document.querySelector('.copy-btn');
  if (btn) {
    btn.textContent = '✓ Copied!';
    setTimeout(() => btn.textContent = '⎘ Copy syntax', 2000);
  }
}

/* ── Search ───────────────────────────────────────────────────── */
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  if (searchQuery) activeCat = 'all';
  renderSidebar();
  renderList();
});

/* ── Keyboard shortcuts ───────────────────────────────────────── */
document.addEventListener('keydown', e => {
  // Ctrl+K or / to focus search
  if ((e.ctrlKey && e.key === 'k') || (e.key === '/' && document.activeElement.tagName !== 'INPUT')) {
    e.preventDefault();
    document.getElementById('search').focus();
    document.getElementById('search').select();
    return;
  }

  // Escape to clear search
  if (e.key === 'Escape') {
    const s = document.getElementById('search');
    if (document.activeElement === s) {
      s.value = '';
      searchQuery = '';
      renderSidebar();
      renderList();
      s.blur();
    }
    return;
  }

  // Arrow key navigation through list
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    const filtered = getFiltered();
    if (!filtered.length) return;
    const idx = filtered.findIndex(c => c.name === activeCmd);
    let next;
    if (e.key === 'ArrowDown') next = idx < filtered.length - 1 ? idx + 1 : 0;
    else next = idx > 0 ? idx - 1 : filtered.length - 1;
    selectCmd(filtered[next].name);
    // scroll into view
    const items = document.querySelectorAll('.cmd-item');
    if (items[next]) items[next].scrollIntoView({ block: 'nearest' });
    return;
  }
});

/* ── Init ─────────────────────────────────────────────────────── */
renderSidebar();
renderList();
// Select first command on load
if (CMDS.length) {
  setTimeout(() => selectCmd(CMDS[0].name), 80);
}
</script>
</body>
</html>
