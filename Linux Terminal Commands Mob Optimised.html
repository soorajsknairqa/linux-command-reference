<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1117">
<title>Linux Commands Reference</title>
</head>
<body style="margin:0;padding:0;background:#0d1117;">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap');

  :root {
    --term-bg: #0d1117;
    --term-surface: #161b22;
    --term-card: #1c2128;
    --term-border: #30363d;
    --term-green: #3fb950;
    --term-cyan: #79c0ff;
    --term-yellow: #e3b341;
    --term-purple: #d2a8ff;
    --term-red: #f85149;
    --term-orange: #ffa657;
    --term-text: #c9d1d9;
    --term-muted: #8b949e;
    --term-accent: #58a6ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  #root {
    font-family: 'Sora', sans-serif;
    background: var(--term-bg);
    color: var(--term-text);
    min-height: 100dvh;
    min-height: 100vh;
    overflow: hidden;
  }

  .header {
    background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
    border-bottom: 1px solid var(--term-border);
    padding: 16px 20px 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .terminal-icon {
    width: 36px;
    height: 36px;
    background: var(--term-green);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    color: #0d1117;
    flex-shrink: 0;
  }

  .header-title {
    font-family: 'Sora', sans-serif;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
  }

  .header-sub {
    font-size: 11px;
    color: var(--term-muted);
    margin-top: 1px;
  }

  .count-badge {
    margin-left: auto;
    background: rgba(63,185,80,0.15);
    border: 1px solid rgba(63,185,80,0.3);
    color: var(--term-green);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    font-family: 'JetBrains Mono', monospace;
  }

  .search-bar {
    display: flex;
    align-items: center;
    background: var(--term-surface);
    border: 1px solid var(--term-border);
    border-radius: 10px;
    padding: 0 12px;
    gap: 8px;
    transition: border-color 0.2s;
  }

  .search-bar:focus-within {
    border-color: var(--term-accent);
  }

  .search-icon {
    color: var(--term-muted);
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
  }

  .search-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--term-text);
    font-size: 16px; /* prevents iOS auto-zoom on focus */
    font-family: 'JetBrains Mono', monospace;
    padding: 11px 0;
  }

  .search-input::placeholder {
    color: var(--term-muted);
  }

  .categories {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 10px 20px 0;
    scrollbar-width: none;
    background: var(--term-bg);
  }

  .categories::-webkit-scrollbar { display: none; }

  .cat-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid var(--term-border);
    background: none;
    color: var(--term-muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
    font-family: 'Sora', sans-serif;
    letter-spacing: 0.3px;
    min-height: 36px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .cat-btn:hover { background: var(--term-surface); color: var(--term-text); }

  .cat-btn.active {
    background: var(--term-surface);
    border-color: var(--cat-color, var(--term-accent));
    color: var(--cat-color, var(--term-accent));
  }

  .cat-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }

  .content {
    padding: 12px 16px 100px;
    overflow-y: auto;
    height: calc(100dvh - 150px);
    height: calc(100vh - 150px);
    -webkit-overflow-scrolling: touch;
  }

  .section-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--term-muted);
    letter-spacing: 1.2px;
    text-transform: uppercase;
    margin: 16px 0 8px 2px;
  }

  .commands-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .cmd-card {
    background: var(--term-card);
    border: 1px solid var(--term-border);
    border-radius: 10px;
    padding: 14px 14px 12px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .cmd-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--cat-color, var(--term-accent));
    opacity: 0;
    transition: opacity 0.15s;
  }

  .cmd-card:hover {
    border-color: var(--cat-color, var(--term-accent));
    background: var(--term-surface);
  }

  .cmd-card:active {
    border-color: var(--cat-color, var(--term-accent));
    background: var(--term-surface);
  }

  .cmd-card:hover::before,
  .cmd-card:active::before { opacity: 1; }

  .cmd-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
  }

  .cmd-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    color: var(--cat-color, var(--term-cyan));
  }

  .cmd-badge {
    font-size: 9px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
    background: rgba(255,255,255,0.06);
    color: var(--term-muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .cmd-desc {
    font-size: 12px;
    color: var(--term-muted);
    line-height: 1.5;
    margin-bottom: 8px;
  }

  .cmd-syntax {
    margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--term-yellow);
    background: rgba(0,0,0,0.3);
    padding: 5px 8px;
    border-radius: 5px;
    display: block; /* always visible on mobile — no hover needed */
  }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 999;
    align-items: flex-end; /* slide up from bottom on mobile */
    justify-content: center;
    padding: 0;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--term-card);
    border: 1px solid var(--term-border);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 100%;
    max-height: 90dvh;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    -webkit-overflow-scrolling: touch;
    padding-bottom: env(safe-area-inset-bottom, 16px);
  }

  /* pull-handle indicator */
  .modal::before {
    content: '';
    display: block;
    width: 36px;
    height: 4px;
    background: var(--term-border);
    border-radius: 2px;
    margin: 10px auto 0;
  }

  .modal-header {
    padding: 14px 20px 14px;
    border-bottom: 1px solid var(--term-border);
    position: sticky;
    top: 0;
    background: var(--term-card);
    z-index: 10;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .modal-icon {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .modal-cmd {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
  }

  .modal-cat {
    font-size: 11px;
    color: var(--term-muted);
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 600;
  }

  .modal-close {
    margin-left: auto;
    background: rgba(255,255,255,0.08);
    border: none;
    color: var(--term-muted);
    cursor: pointer;
    font-size: 16px;
    padding: 0;
    line-height: 1;
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .modal-close:hover,
  .modal-close:active { color: var(--term-text); background: rgba(255,255,255,0.15); }

  .modal-body { padding: 18px 20px 20px; }

  .modal-section-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--term-muted);
    margin-bottom: 8px;
    margin-top: 16px;
  }

  .modal-section-title:first-child { margin-top: 0; }

  .modal-desc {
    font-size: 13px;
    line-height: 1.7;
    color: var(--term-text);
  }

  .modal-syntax-block {
    background: #0d1117;
    border: 1px solid var(--term-border);
    border-radius: 8px;
    padding: 10px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--term-yellow);
    margin-bottom: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    white-space: nowrap;
  }

  .option-row {
    display: flex;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid rgba(48,54,61,0.5);
    font-size: 12px;
    align-items: flex-start;
  }

  .option-row:last-child { border-bottom: none; }

  .option-flag {
    font-family: 'JetBrains Mono', monospace;
    color: var(--term-orange);
    min-width: 70px;
    flex-shrink: 0;
    font-size: 12px;
  }

  .option-desc { color: var(--term-text); line-height: 1.5; }

  .example-block {
    background: #0d1117;
    border: 1px solid var(--term-border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .example-topbar {
    background: rgba(255,255,255,0.04);
    padding: 5px 12px;
    font-size: 10px;
    color: var(--term-muted);
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--term-border);
    font-family: 'JetBrains Mono', monospace;
  }

  .example-code {
    padding: 10px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.8;
    white-space: pre;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    max-width: 100%;
  }

  .ex-prompt { color: var(--term-green); }
  .ex-cmd    { color: var(--term-cyan); }
  .ex-flag   { color: var(--term-orange); }
  .ex-arg    { color: var(--term-purple); }
  .ex-out    { color: var(--term-muted); }

  .no-results {
    text-align: center;
    padding: 48px 20px;
    color: var(--term-muted);
  }

  .no-results-icon {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    color: var(--term-border);
    display: block;
    margin-bottom: 12px;
  }

  .copy-btn {
    background: rgba(63,185,80,0.1);
    border: 1px solid rgba(63,185,80,0.3);
    color: var(--term-green);
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    margin-top: 8px;
    transition: background 0.15s;
    min-height: 40px;
    display: inline-flex;
    align-items: center;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .copy-btn:hover,
  .copy-btn:active { background: rgba(63,185,80,0.2); }

  .related-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  .tag {
    font-size: 12px;
    padding: 6px 12px;
    background: var(--term-surface);
    border: 1px solid var(--term-border);
    border-radius: 8px;
    color: var(--term-muted);
    font-family: 'JetBrains Mono', monospace;
    cursor: pointer;
    transition: all 0.15s;
    min-height: 36px;
    display: inline-flex;
    align-items: center;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  /* option-flag wrapping on narrow screens */
  .option-row {
    display: flex;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid rgba(48,54,61,0.5);
    font-size: 12px;
    align-items: flex-start;
    flex-wrap: wrap;
  }

  .option-flag {
    font-family: 'JetBrains Mono', monospace;
    color: var(--term-orange);
    min-width: 100px;
    flex-shrink: 0;
    font-size: 12px;
  }

  .option-desc { color: var(--term-text); line-height: 1.6; flex: 1; min-width: 140px; }

  /* Tablet / desktop: restore centred modal */
  @media (min-width: 600px) {
    .modal-overlay {
      align-items: center;
      padding: 20px;
    }
    .modal {
      border-radius: 16px;
      max-width: 520px;
      max-height: 80vh;
    }
    .modal::before { display: none; }
    .content {
      height: calc(100vh - 140px);
      padding-bottom: 24px;
    }
    .cmd-syntax { display: none; }
    .cmd-card:hover .cmd-syntax { display: block; }
    .search-input { font-size: 13px; }
  }
</style>

<div id="root">
  <div class="header">
    <div class="header-top">
      <div class="terminal-icon">$_</div>
      <div>
        <div class="header-title">Linux Commands</div>
        <div class="header-sub">Complete reference · 200+ commands</div>
      </div>
      <div class="count-badge" id="result-count">200+</div>
    </div>
    <div class="search-bar">
      <span class="search-icon">❯</span>
      <input class="search-input" type="text" id="search" placeholder="Search commands, options, descriptions..." />
    </div>
  </div>

  <div class="categories" id="categories"></div>
  <div class="content" id="content"></div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-box"></div>
</div>

<script>
const CATS = [
  { id:'all',    label:'All',         color:'#58a6ff', icon:'⬡' },
  { id:'nav',    label:'Navigation',  color:'#3fb950', icon:'⬡' },
  { id:'file',   label:'Files',       color:'#79c0ff', icon:'⬡' },
  { id:'perm',   label:'Permissions', color:'#e3b341', icon:'⬡' },
  { id:'proc',   label:'Process',     color:'#d2a8ff', icon:'⬡' },
  { id:'net',    label:'Network',     color:'#ffa657', icon:'⬡' },
  { id:'text',   label:'Text',        color:'#3fb950', icon:'⬡' },
  { id:'search', label:'Search',      color:'#f85149', icon:'⬡' },
  { id:'sys',    label:'System',      color:'#79c0ff', icon:'⬡' },
  { id:'arch',   label:'Archive',     color:'#e3b341', icon:'⬡' },
  { id:'disk',   label:'Disk',        color:'#d2a8ff', icon:'⬡' },
  { id:'user',   label:'Users',       color:'#ffa657', icon:'⬡' },
  { id:'pkg',    label:'Package',     color:'#3fb950', icon:'⬡' },
  { id:'shell',  label:'Shell',       color:'#58a6ff', icon:'⬡' },
  { id:'ssh',    label:'SSH/Remote',  color:'#f85149', icon:'⬡' },
  { id:'misc',   label:'Misc',        color:'#8b949e', icon:'⬡' },
];

const COMMANDS = [
  // Navigation
  { name:'pwd',     cat:'nav',   desc:'Print working directory — shows current location in filesystem.',
    syntax:'pwd [-LP]',
    options:[{f:'-L',d:'Follow logical symlinks (default)'},{f:'-P',d:'Show physical path, resolving symlinks'}],
    examples:[{title:'Basic usage',code:`<span class="ex-prompt">$</span> <span class="ex-cmd">pwd</span>\n<span class="ex-out">/home/user/projects</span>`}],
    tags:['cd','ls','path'] },
  { name:'cd',      cat:'nav',   desc:'Change directory. Navigate the filesystem tree.',
    syntax:'cd [directory]',
    options:[{f:'~',d:'Home directory'},{f:'-',d:'Previous directory'},{f:'..',d:'Parent directory'}],
    examples:[{title:'Examples',code:`<span class="ex-prompt">$</span> <span class="ex-cmd">cd</span> <span class="ex-arg">~/Documents</span>\n<span class="ex-prompt">$</span> <span class="ex-cmd">cd</span> <span class="ex-arg">-</span>       <span class="ex-out"># back to previous</span>\n<span class="ex-prompt">$</span> <span class="ex-cmd">cd</span> <span class="ex-arg">..</span>      <span class="ex-out"># parent dir</span>`}],
    tags:['pwd','ls'] },
  { name:'ls',      cat:'nav',   desc:'List directory contents. One of the most frequently used commands.',
    syntax:'ls [options] [path]',
    options:[{f:'-l',d:'Long format with permissions, owner, size, date'},{f:'-a',d:'Show hidden files (starting with .)'},{f:'-h',d:'Human readable sizes'},{f:'-R',d:'Recursive listing'},{f:'-t',d:'Sort by modification time'},{f:'-S',d:'Sort by file size'}],
    examples:[{title:'Common usage',code:`<span class="ex-prompt">$</span> <span class="ex-cmd">ls</span> <span class="ex-flag">-lah</span>\n<span class="ex-out">total 64K\ndrwxr-xr-x 12 user user 4.0K Jan 10 12:34 .\ndrwxr-xr-x  3 user user 4.0K Jan  9 10:00 ..\n-rw-r--r--  1 user user 2.1K Jan 10 11:20 notes.txt</span>`}],
    tags:['dir','tree','find'] },
  { name:'tree',    cat:'nav',   desc:'Display directory structure in a tree format.',
    syntax:'tree [options] [directory]',
    options:[{f:'-L n',d:'Limit depth to n levels'},{f:'-a',d:'Show hidden files'},{f:'-d',d:'Directories only'},{f:'-f',d:'Print full path prefix'}],
    examples:[{title:'Depth limited',code:`<span class="ex-prompt">$</span> <span class="ex-cmd">tree</span> <span class="ex-flag">-L 2</span> <span class="ex-arg">.</span>\n<span class="ex-out">.\n├── src\n│   ├── main.c\n│   └── utils.c\n└── README.md</span>`}],
    tags:['ls','find'] },
  { name:'pushd',   cat:'nav',   desc:'Push directory onto stack and change to it.',
    syntax:'pushd [directory]',
    options:[],
    examples:[{title:'Stack navigation',code:`<span class="ex-prompt">$</span> <span class="ex-cmd">pushd</span> <span class="ex-arg">/etc</span>\n<span class="ex-prompt">$</span> <span class="ex-cmd">popd</span>     <span class="ex-out"># return to previous</span>`}],
    tags:['popd','cd'] },
  { name:'popd',    cat:'nav',   desc:'Pop directory from stack and change to it.',
    syntax:'popd', options:[], examples:[], tags:['pushd'] },

  // Files
  { name:'cp',      cat:'file',  desc:'Copy files and directories.',
    syntax:'cp [options] source destination',
    options:[{f:'-r',d:'Copy directories recursively'},{f:'-p',d:'Preserve timestamps and permissions'},{f:'-u',d:'Copy only when source is newer'},{f:'-v',d:'Verbose output'},{f:'-i',d:'Prompt before overwrite'},{f:'-a',d:'Archive mode (preserves everything)'}],
    examples:[{title:'Copy with preserve',code:`<span class="ex-prompt">$</span> <span class="ex-cmd">cp</span> <span class="ex-flag">-rp</span> <span class="ex-arg">src/ dest/</span>\n<span class="ex-prompt">$</span> <span class="ex-cmd">cp</span> <span class="ex-flag">-v</span> <span class="ex-arg">*.txt backup/</span>`}],
    tags:['mv','rsync','scp'] },
  { name:'mv',      cat:'file',  desc:'Move or rename files and directories.',
    syntax:'mv [options] source destination',
    options:[{f:'-i',d:'Prompt before overwriting'},{f:'-n',d:'Do not overwrite'},{f:'-v',d:'Verbose'}],
    examples:[{title:'Rename and move',code:`<span class="ex-prompt">$</span> <span class="ex-cmd">mv</span> <span class="ex-arg">old.txt new.txt</span>\n<span class="ex-prompt">$</span> <span class="ex-cmd">mv</span> <span class="ex-arg">file.txt /home/user/docs/</span>`}],
    tags:['cp','rename'] },
  { name:'rm',      cat:'file',  desc:'Remove files or directories. Use with caution — no recycle bin!',
    syntax:'rm [options] files',
    options:[{f:'-r',d:'Remove directories recursively'},{f:'-f',d:'Force removal, no prompts'},{f:'-i',d:'Prompt before each removal'},{f:'-v',d:'Verbose'}],
    examples:[{title:'Remove files',code:`<span class="ex-prompt">$</span> <span class="ex-cmd">rm</span> <span class="ex-arg">file.txt</span>\n<span class="ex-prompt">$</span> <span class="ex-cmd">rm</span> <span class="ex-flag">-rf</span> <span class="ex-arg">temp_dir/</span>  <span class="ex-out"># ⚠ use carefully</span>`}],
    tags:['rmdir','shred','unlink'] },
  { name:'mkdir',   cat:'file',  desc:'Create directories.',
    syntax:'mkdir [options] directory',
    options:[{f:'-p',d:'Create parent directories as needed'},{f:'-m',d:'Set permissions mode'}],
    examples:[{title:'Create nested dirs',code:`<span class="ex-prompt">$</span> <span class="ex-cmd">mkdir</span> <span class="ex-flag">-p</span> <span class="ex-arg">a/b/c/d</span>`}],
    tags:['rmdir','mkdtemp'] },
  { name:'rmdir',   cat:'file',  desc:'Remove empty directories.',
    syntax:'rmdir [options] directory',
    options:[{f:'-p',d:'Remove parent directories if empty too'}],

    options:[{f:'-l',d:'Load math library (pi, scale, etc.)'},{f:'-q',d:'Quiet — suppress welcome message'}],
    examples:[{title:'Calculate',code:`<span class="ex-prompt">$</span> <span class="ex-cmd">echo</span> <span class="ex-arg">"scale=4; sqrt(2)"</span> | <span class="ex-cmd">bc</span> <span class="ex-flag">-l</span>\n<span class="ex-out">1.4142</span>`}],
    tags:['python','expr','awk'] },
  { name:'nl',      cat:'misc',  desc:'Number lines of a file.',
    syntax:'nl [options] file',
    options:[{f:'-b style',d:'Number lines of selected body: a=all, n=none, t=non-empty'},{f:'-n format',d:'Line number format: ln, rn, rz'}],
    examples:[{title:'Number lines',code:`<span class="ex-prompt">$</span> <span class="ex-cmd">nl</span> <span class="ex-arg">file.txt</span>`}],
    tags:['cat','wc'] },
  { name:'column',  cat:'misc',  desc:'Columnate lists — format data in columns.',
    syntax:'column [options] [file]',
    options:[{f:'-t',d:'Table mode — determine columns from input'},{f:'-s sep',d:'Column separator'},{f:'-N names',d:'Column names (header)'}],
    examples:[{title:'Format table',code:`<span class="ex-prompt">$</span> <span class="ex-cmd">column</span> <span class="ex-flag">-t -s,</span> <span class="ex-arg">data.csv</span>`}],
    tags:['awk','pr','fmt'] },
  { name:'yes',     cat:'misc',  desc:'Output a string repeatedly until killed.',
    syntax:'yes [string]',
    options:[],
    examples:[{title:'Auto-confirm',code:`<span class="ex-prompt">$</span> <span class="ex-cmd">yes</span> | <span class="ex-cmd">apt</span> <span class="ex-arg">upgrade</span>  <span class="ex-out"># ⚠ auto-yes</span>`}],
    tags:['expect','timeout'] },
  { name:'timeout', cat:'misc',  desc:'Run a command with a time limit.',
    syntax:'timeout [options] duration command',
    options:[{f:'-s sig',d:'Signal to send on timeout'},{f:'-k kill',d:'Hard kill after this much more time'}],
    examples:[{title:'Limit runtime',code:`<span class="ex-prompt">$</span> <span class="ex-cmd">timeout</span> <span class="ex-arg">30s ./long-script.sh</span>`}],
    tags:['time','kill','watch'] },
];

let activeCategory = 'all';
let searchQuery = '';
let currentCmd = null;

function catColor(id) {
  return (CATS.find(c => c.id === id) || {}).color || '#58a6ff';
}

function renderCategories() {
  const el = document.getElementById('categories');
  el.innerHTML = CATS.map(c => `
    <button class="cat-btn ${activeCategory === c.id ? 'active' : ''}"
      style="--cat-color: ${c.color}"
      onclick="setCategory('${c.id}')">
      <span class="cat-dot"></span>${c.label}
    </button>`).join('');
}

function getFiltered() {
  return COMMANDS.filter(cmd => {
    const matchCat = activeCategory === 'all' || cmd.cat === activeCategory;
    const q = searchQuery.toLowerCase();
    const matchSearch = !q || cmd.name.includes(q) || cmd.desc.toLowerCase().includes(q)
      || (cmd.tags || []).some(t => t.includes(q));
    return matchCat && matchSearch;
  });
}

function renderContent() {
  const filtered = getFiltered();
  const el = document.getElementById('content');
  document.getElementById('result-count').textContent = filtered.length;

  if (!filtered.length) {
    el.innerHTML = `<div class="no-results">
      <span class="no-results-icon">¬</span>
      <div>No commands found for "<strong style="color:var(--term-text)">${searchQuery}</strong>"</div>
      <div style="margin-top:6px;font-size:12px">Try a different search term</div>
    </div>`;
    return;
  }

  const groups = {};
  filtered.forEach(c => {
    if (!groups[c.cat]) groups[c.cat] = [];
    groups[c.cat].push(c);
  });

  let html = '';
  if (activeCategory === 'all') {
    Object.keys(groups).forEach(cat => {
      const catObj = CATS.find(c => c.id === cat);
      html += `<div class="section-label">${catObj ? catObj.label : cat} <span style="opacity:.5">(${groups[cat].length})</span></div>`;
      html += '<div class="commands-grid">' + groups[cat].map(cmd => renderCard(cmd)).join('') + '</div>';
    });
  } else {
    html = '<div class="commands-grid">' + filtered.map(cmd => renderCard(cmd)).join('') + '</div>';
  }
  el.innerHTML = html;
}

function renderCard(cmd) {
  const color = catColor(cmd.cat);
  return `<div class="cmd-card" style="--cat-color:${color}" onclick="openModal('${cmd.name}')">
    <div class="cmd-top">
      <span class="cmd-name">${cmd.name}</span>
      <span class="cmd-badge">${(CATS.find(c=>c.id===cmd.cat)||{}).label||cmd.cat}</span>
    </div>
    <div class="cmd-desc">${cmd.desc.split('—')[0].trim()}</div>
    <div class="cmd-syntax">${cmd.syntax}</div>
  </div>`;
}

function openModal(name) {
  const cmd = COMMANDS.find(c => c.name === name);
  if (!cmd) return;
  currentCmd = cmd;
  const color = catColor(cmd.cat);
  const catLabel = (CATS.find(c=>c.id===cmd.cat)||{}).label||cmd.cat;

  let optHtml = '';
  if (cmd.options && cmd.options.length) {
    optHtml = `<div class="modal-section-title">Options & flags</div>
      <div>${cmd.options.map(o => `
        <div class="option-row">
          <span class="option-flag">${o.f}</span>
          <span class="option-desc">${o.d}</span>
        </div>`).join('')}</div>`;
  }

  let exHtml = '';
  if (cmd.examples && cmd.examples.length) {
    exHtml = `<div class="modal-section-title">Examples</div>` +
      cmd.examples.map(ex => `
        <div class="example-block">
          <div class="example-topbar">bash — ${ex.title}</div>
          <div class="example-code">${ex.code}</div>
        </div>
        <button class="copy-btn" onclick="copySyntax('${cmd.name}')">Copy syntax</button>
      `).join('');
  }

  let tagsHtml = '';
  if (cmd.tags && cmd.tags.length) {
    tagsHtml = `<div class="modal-section-title">Related commands</div>
      <div class="related-tags">${cmd.tags.map(t => {
        const found = COMMANDS.find(c=>c.name===t);
        return `<span class="tag" onclick="${found?`openModal('${t}')`:`void(0)`}">${t}</span>`;
      }).join('')}</div>`;
  }

  document.getElementById('modal-box').innerHTML = `
    <div class="modal-header">
      <div class="modal-icon" style="background:${color}20; color:${color}; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14px">${cmd.name.slice(0,4)}</div>
      <div>
        <div class="modal-cmd" style="color:${color}">${cmd.name}</div>
        <div class="modal-cat">${catLabel}</div>
      </div>
      <button class="modal-close" onclick="closeModalBtn()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-section-title">Description</div>
      <div class="modal-desc">${cmd.desc}</div>
      <div class="modal-section-title" style="margin-top:14px">Syntax</div>
      <div class="modal-syntax-block">${cmd.syntax}</div>
      ${optHtml}${exHtml}${tagsHtml}
    </div>`;

  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e) {
  if (e.target.id === 'modal-overlay') closeModalBtn();
}

function closeModalBtn() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function copySyntax(name) {
  const cmd = COMMANDS.find(c=>c.name===name);
  if (cmd && navigator.clipboard) {
    navigator.clipboard.writeText(cmd.syntax);
  }
}

function setCategory(id) {
  activeCategory = id;
  renderCategories();
  renderContent();
}

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value;
  if (searchQuery) activeCategory = 'all';
  renderCategories();
  renderContent();
});

renderCategories();
renderContent();
</script>
</body>
</html>
